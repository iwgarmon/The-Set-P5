<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>The Set – Studio Editor</title>

  <!-- Three.js + controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      overflow:hidden;background:#000;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      user-select:none;-webkit-user-select:none;
      touch-action:none;
    }
    canvas{
      display:block;width:100vw !important;height:100vh !important;
      position:fixed;inset:0;
    }

    /* ========== MAIN MENU ========== */
    #main-menu{
      position:fixed;inset:0;z-index:500;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:linear-gradient(180deg, #0a0a0a 0%, #111 40%, #0d0d0d 100%);
      transition:opacity 1.2s ease;
      opacity:1;
    }
    #main-menu.fade-out{
      opacity:0;
      pointer-events:none;
    }

    .menu-logo{
      font-weight:950;font-size:clamp(36px,8vw,64px);
      letter-spacing:4px;text-transform:uppercase;
      background:linear-gradient(135deg,#fff 0%,#aaa 50%,#ffd64a 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      margin-bottom:8px;
    }
    .menu-subtitle{
      font-size:clamp(11px,2.5vw,14px);
      letter-spacing:3px;text-transform:uppercase;
      color:rgba(255,255,255,0.35);
      font-weight:700;
      margin-bottom:48px;
    }
    .menu-buttons{
      display:flex;flex-direction:column;gap:16px;
      align-items:center;
    }
    .menu-btn{
      cursor:pointer;
      width:220px;padding:16px 0;
      font-size:14px;font-weight:900;
      letter-spacing:2px;text-transform:uppercase;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(255,255,255,0.04);
      color:#fff;
      transition:transform .08s, background .2s, border-color .2s;
      text-align:center;
    }
    .menu-btn:hover{
      background:rgba(255,255,255,0.08);
      border-color:rgba(255,255,255,0.32);
    }
    .menu-btn:active{transform:scale(0.96);}
    .menu-btn.play{
      background:rgba(255,214,74,0.10);
      border-color:rgba(255,214,74,0.35);
      color:#ffd64a;
    }
    .menu-btn.play:hover{
      background:rgba(255,214,74,0.18);
      border-color:rgba(255,214,74,0.55);
    }
    .menu-btn.exit{
      color:rgba(255,255,255,0.45);
      border-color:rgba(255,255,255,0.10);
    }

    /* Decorative lines on menu */
    .menu-line{
      width:60px;height:1px;
      background:rgba(255,255,255,0.12);
      margin:24px auto 0;
    }
    .menu-version{
      margin-top:16px;
      font-size:10px;letter-spacing:2px;
      color:rgba(255,255,255,0.15);
      font-weight:700;text-transform:uppercase;
    }

    /* ========== EDITOR UI ========== */
    #editor-ui{
      position:fixed;inset:0;z-index:100;pointer-events:none;
      opacity:0;
      transition:opacity 0.6s ease 0.6s;
    }
    #editor-ui.visible{opacity:1;}

    .panel{
      pointer-events:auto;
      background:rgba(0,0,0,0.86);
      border:1px solid rgba(255,255,255,0.16);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      border-radius:14px;
      box-shadow:0 10px 24px rgba(0,0,0,0.45);
    }

    /* Top bar */
    #top-bar{
      position:fixed;top:12px;left:12px;right:12px;
      display:flex;justify-content:space-between;align-items:flex-start;
      pointer-events:none;
    }
    #top-bar > *{pointer-events:auto;}

    .editor-brand{
      display:flex;align-items:center;gap:10px;
    }
    .brand-logo{
      font-weight:950;font-size:14px;
      background:#fff;color:#000;
      padding:5px 12px;border-radius:10px;
      letter-spacing:1px;text-transform:uppercase;
    }
    .brand-mode{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-weight:900;color:#ffd64a;font-size:11px;
      letter-spacing:1px;text-transform:uppercase;
      text-shadow:0 0 8px rgba(255,214,74,0.3);
    }

    /* Info bar - bottom */
    #info-bar{
      position:fixed;bottom:12px;left:12px;right:12px;
      display:flex;justify-content:space-between;align-items:flex-end;
      pointer-events:none;
    }
    #info-bar > *{pointer-events:auto;}

    #selection-info{
      padding:10px 14px;
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:11px;font-weight:700;
      letter-spacing:0.5px;
      color:rgba(255,255,255,0.55);
    }
    #selection-info .sel-name{
      color:#ffd64a;font-weight:900;
      text-shadow:0 0 8px rgba(255,214,74,0.25);
    }
    #selection-info .sel-pos{
      color:rgba(255,255,255,0.35);
      margin-left:12px;
    }

    #controls-hint{
      padding:10px 14px;
      font-size:10px;font-weight:800;
      letter-spacing:1px;text-transform:uppercase;
      color:rgba(255,255,255,0.30);
    }

    /* Crosshair indicator for selected object */
    .crosshair{
      position:fixed;
      width:24px;height:24px;
      pointer-events:none;z-index:150;
      transform:translate(-50%,-50%);
      opacity:0;
      transition:opacity 0.2s;
    }
    .crosshair.visible{opacity:1;}
    .crosshair::before,.crosshair::after{
      content:'';position:absolute;
      background:rgba(255,214,74,0.6);
    }
    .crosshair::before{
      width:2px;height:100%;left:50%;top:0;
      transform:translateX(-50%);
    }
    .crosshair::after{
      width:100%;height:2px;top:50%;left:0;
      transform:translateY(-50%);
    }

    /* Object highlight ring (projected to screen) */
    .select-ring{
      position:fixed;
      border:2px solid rgba(255,214,74,0.45);
      border-radius:50%;
      pointer-events:none;z-index:140;
      transform:translate(-50%,-50%);
      box-shadow:0 0 12px rgba(255,214,74,0.15);
      transition:opacity 0.2s;
    }

    /* Grid overlay for editor feel */
    #grid-overlay{
      position:fixed;inset:0;z-index:80;pointer-events:none;
      opacity:0;transition:opacity 0.6s ease 0.8s;
    }
    #grid-overlay.visible{opacity:1;}

    /* Debug overlay */
    #debug{
      position:fixed;inset:0;z-index:9999;
      display:none;padding:16px;background:rgba(0,0,0,0.92);
      overflow:auto;pointer-events:auto;
    }
    #debug.show{display:block;}
    #debug pre{
      white-space:pre-wrap;
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:12px;line-height:1.35;
    }
  </style>
</head>

<body>
  <!-- Main Menu -->
  <div id="main-menu">
    <div class="menu-logo">The Set</div>
    <div class="menu-subtitle">Studio Editor</div>
    <div class="menu-buttons">
      <button class="menu-btn play" id="btn-play">Play</button>
      <button class="menu-btn exit" id="btn-exit">Exit</button>
    </div>
    <div class="menu-line"></div>
    <div class="menu-version">v2.0</div>
  </div>

  <!-- Editor UI (hidden until play) -->
  <div id="editor-ui">
    <div id="top-bar">
      <div class="panel" style="padding:10px 14px;">
        <div class="editor-brand">
          <div class="brand-logo">The Set</div>
          <div class="brand-mode">Editor</div>
        </div>
      </div>
      <div class="panel" style="padding:10px 14px;">
        <div style="font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace;font-size:11px;opacity:0.6;" id="fps">FPS: --</div>
      </div>
    </div>

    <div id="info-bar">
      <div class="panel" id="selection-info">
        <span class="sel-name" id="sel-name">Nothing selected</span>
        <span class="sel-pos" id="sel-pos"></span>
      </div>
      <div class="panel" id="controls-hint">
        Tap to select &middot; Drag to move &middot; Pinch/scroll to zoom
      </div>
    </div>
  </div>

  <div id="grid-overlay"></div>

  <!-- Debug overlay -->
  <div id="debug">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div style="font-weight:950; letter-spacing:1px; text-transform:uppercase;">Crash / Debug</div>
      <button id="debug-close" style="cursor:pointer;padding:8px 12px;font-size:11px;font-weight:900;border-radius:10px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.04);color:#fff;">Close</button>
    </div>
    <pre id="debug-text"></pre>
  </div>

  <script>
    /* =========================
       Debug overlay
    ========================= */
    (function(){
      const dbg = document.getElementById('debug');
      const dbgText = document.getElementById('debug-text');
      document.getElementById('debug-close').addEventListener('click', ()=> dbg.classList.remove('show'));
      function show(msg){ dbg.classList.add('show'); dbgText.textContent = msg; }
      window.addEventListener('error', (e)=>{
        show("JS ERROR:\n" + (e.message||"") + "\n" + (e.filename||"") + ":" + (e.lineno||"") + ":" + (e.colno||"") +
             "\n\n" + (e.error && e.error.stack ? e.error.stack : ""));
      });
      window.addEventListener('unhandledrejection', (e)=>{
        show("UNHANDLED PROMISE:\n" + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)));
      });
    })();

    /* =========================
       App state
    ========================= */
    const APP = {
      scene: null,
      renderer: null,
      camera: null,
      controls: null,

      started: false,

      selectable: [],
      selected: null,

      drag: {
        active: false,
        plane: new THREE.Plane(new THREE.Vector3(0, 1, 0), 0),
        intersection: new THREE.Vector3(),
        offset: new THREE.Vector3(),
        pointerId: -1
      },

      ray: null,
      ndc: null,

      fps: { last: performance.now(), frames: 0 },

      // References to key objects
      statue: null,
      studioLight: null
    };

    /* =========================
       Main menu
    ========================= */
    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-exit').addEventListener('click', ()=>{
      // "Exit" - close the window or go back
      if (window.opener) {
        window.close();
      } else if (history.length > 1) {
        history.back();
      } else {
        // Nowhere to go, just show a message on the menu
        document.querySelector('.menu-subtitle').textContent = 'No previous page to return to';
      }
    });

    function startGame(){
      if (APP.started) return;
      APP.started = true;

      // Fade out menu
      const menu = document.getElementById('main-menu');
      menu.classList.add('fade-out');

      // After fade, remove menu from DOM and show editor
      setTimeout(()=>{
        menu.style.display = 'none';
        document.getElementById('editor-ui').classList.add('visible');
        document.getElementById('grid-overlay').classList.add('visible');
      }, 1200);

      // Initialize the 3D scene
      init();
    }

    /* =========================
       Initialization
    ========================= */
    function init(){
      APP.ray = new THREE.Raycaster();
      APP.ndc = new THREE.Vector2();

      initRenderer();
      initCamera();
      initControls();
      initScene();
      initLighting();
      initStatue();
      initStudioLight();
      initUI();

      animate();
    }

    function initRenderer(){
      APP.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      APP.renderer.setSize(window.innerWidth, window.innerHeight);
      APP.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      APP.renderer.shadowMap.enabled = true;
      APP.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      APP.renderer.toneMapping = THREE.ACESFilmicToneMapping;
      APP.renderer.toneMappingExposure = 1.0;
      document.body.insertBefore(APP.renderer.domElement, document.body.firstChild);
    }

    function initCamera(){
      const aspect = window.innerWidth / window.innerHeight;
      APP.camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 500);
      // Top-down angled view
      APP.camera.position.set(0, 14, 10);
      APP.camera.lookAt(0, 0, 0);
    }

    function initControls(){
      APP.controls = new THREE.OrbitControls(APP.camera, APP.renderer.domElement);
      APP.controls.enableDamping = true;
      APP.controls.dampingFactor = 0.08;
      APP.controls.target.set(0, 0, 0);
      APP.controls.minDistance = 5;
      APP.controls.maxDistance = 40;
      APP.controls.maxPolarAngle = Math.PI / 2.2; // Prevent going below the floor
      APP.controls.minPolarAngle = 0.2; // Keep somewhat top-down
      APP.controls.enablePan = true;
      APP.controls.panSpeed = 0.8;
    }

    function initScene(){
      APP.scene = new THREE.Scene();
      APP.scene.background = new THREE.Color(0x0d0d0d);

      // Studio floor
      const floorGeo = new THREE.PlaneGeometry(30, 30);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x1a1a1a,
        roughness: 0.92,
        metalness: 0.08
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      floor.userData.isFloor = true;
      APP.scene.add(floor);

      // Grid lines on the floor for the editor feel
      const gridHelper = new THREE.GridHelper(30, 30, 0x333333, 0x1f1f1f);
      gridHelper.position.y = 0.005;
      APP.scene.add(gridHelper);

      // Back wall
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.95, metalness: 0.05 });
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), wallMat);
      backWall.position.set(0, 6, -8);
      backWall.receiveShadow = true;
      APP.scene.add(backWall);

      // Side walls
      const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), wallMat);
      leftWall.position.set(-8, 6, 0);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.receiveShadow = true;
      APP.scene.add(leftWall);

      const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), wallMat);
      rightWall.position.set(8, 6, 0);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.receiveShadow = true;
      APP.scene.add(rightWall);

      // Cove / curved backdrop
      const curve = new THREE.Mesh(
        new THREE.CylinderGeometry(3, 3, 30, 32, 1, true, 0, Math.PI / 2),
        wallMat
      );
      curve.rotation.z = Math.PI / 2;
      curve.position.set(0, 3, -5);
      APP.scene.add(curve);
    }

    function initLighting(){
      // Soft ambient
      APP.scene.add(new THREE.AmbientLight(0xffffff, 0.25));

      // Key directional light (overhead, slightly angled)
      const key = new THREE.DirectionalLight(0xffffff, 0.6);
      key.position.set(3, 12, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.near = 0.5;
      key.shadow.camera.far = 50;
      key.shadow.camera.left = -12;
      key.shadow.camera.right = 12;
      key.shadow.camera.top = 12;
      key.shadow.camera.bottom = -12;
      APP.scene.add(key);

      // Subtle fill from the other side
      const fill = new THREE.DirectionalLight(0xaaccff, 0.2);
      fill.position.set(-4, 8, 3);
      APP.scene.add(fill);
    }

    /* =========================
       Statue (subject)
    ========================= */
    function initStatue(){
      const group = new THREE.Group();
      group.userData.kind = 'statue';
      group.userData.displayName = 'Statue';

      const stone = new THREE.MeshStandardMaterial({ color: 0x8a8378, roughness: 0.75, metalness: 0.08 });
      const darkStone = new THREE.MeshStandardMaterial({ color: 0x555049, roughness: 0.85, metalness: 0.05 });

      // Pedestal base
      const baseBottom = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.15, 1.2), darkStone);
      baseBottom.position.y = 0.075;
      baseBottom.castShadow = true;
      baseBottom.receiveShadow = true;
      group.add(baseBottom);

      const baseMid = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.6, 1.0), darkStone);
      baseMid.position.y = 0.45;
      baseMid.castShadow = true;
      baseMid.receiveShadow = true;
      group.add(baseMid);

      const baseTop = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.1, 1.1), darkStone);
      baseTop.position.y = 0.8;
      baseTop.castShadow = true;
      baseTop.receiveShadow = true;
      group.add(baseTop);

      // Torso (tapered cylinder)
      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.32, 1.0, 32), stone);
      torso.position.y = 1.35;
      torso.castShadow = true;
      torso.receiveShadow = true;
      group.add(torso);

      // Chest / shoulders (wider)
      const shoulders = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.28, 0.35, 32), stone);
      shoulders.position.y = 1.9;
      shoulders.castShadow = true;
      shoulders.receiveShadow = true;
      group.add(shoulders);

      // Neck
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.2, 24), stone);
      neck.position.y = 2.18;
      neck.castShadow = true;
      neck.receiveShadow = true;
      group.add(neck);

      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), stone);
      head.position.y = 2.42;
      head.scale.set(1, 1.15, 0.95);
      head.castShadow = true;
      head.receiveShadow = true;
      group.add(head);

      // Left arm (hanging)
      const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.7, 16), stone);
      leftArm.position.set(-0.38, 1.6, 0);
      leftArm.rotation.z = 0.12;
      leftArm.castShadow = true;
      group.add(leftArm);

      // Right arm (slightly extended)
      const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.7, 16), stone);
      rightArm.position.set(0.40, 1.65, 0.05);
      rightArm.rotation.z = -0.3;
      rightArm.rotation.x = -0.15;
      rightArm.castShadow = true;
      group.add(rightArm);

      group.position.set(0, 0, 0);
      APP.scene.add(group);
      APP.selectable.push(group);
      APP.statue = group;
    }

    /* =========================
       Studio Light
    ========================= */
    function initStudioLight(){
      const group = new THREE.Group();
      group.userData.kind = 'light';
      group.userData.displayName = 'Studio Light';

      const darkMetal = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7, metalness: 0.3 });
      const lightFace = new THREE.MeshBasicMaterial({ color: 0xffffee });

      // Stand pole
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 3.0, 16), darkMetal);
      pole.position.y = 1.5;
      pole.castShadow = true;
      group.add(pole);

      // Stand base (tripod-like flat disc)
      const standBase = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 0.08, 24), darkMetal);
      standBase.position.y = 0.04;
      standBase.castShadow = true;
      group.add(standBase);

      // Softbox housing
      const housing = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.3), darkMetal);
      housing.position.y = 3.1;
      housing.castShadow = true;
      housing.receiveShadow = true;
      group.add(housing);

      // Softbox bright face
      const face = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), lightFace);
      face.position.set(0, 3.1, 0.16);
      group.add(face);

      // Arm connecting pole to softbox
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.3, 12), darkMetal);
      arm.position.y = 2.95;
      arm.rotation.z = Math.PI / 6;
      group.add(arm);

      // Actual spotlight (casts light from above, pointing at origin)
      const spot = new THREE.SpotLight(0xfff5e0, 5.0, 25, Math.PI / 4, 0.35);
      spot.position.set(0, 3.2, 0);
      spot.castShadow = true;
      spot.shadow.mapSize.set(1024, 1024);
      group.add(spot);

      // Spotlight target
      const target = new THREE.Object3D();
      target.position.set(0, 0, 0);
      group.add(target);
      spot.target = target;

      // Store spotlight reference for later
      group.userData.spotlight = spot;
      group.userData.spotTarget = target;

      group.position.set(3, 0, 2);
      APP.scene.add(group);
      APP.selectable.push(group);
      APP.studioLight = group;
    }

    /* =========================
       UI wiring
    ========================= */
    function initUI(){
      const el = APP.renderer.domElement;
      el.addEventListener('pointerdown', onPointerDown);
      el.addEventListener('pointermove', onPointerMove);
      el.addEventListener('pointerup', onPointerUp);
      el.addEventListener('pointercancel', onPointerUp);

      window.addEventListener('resize', handleResize);
    }

    /* =========================
       Selection & Drag
    ========================= */
    function setNDC(ev){
      const rect = APP.renderer.domElement.getBoundingClientRect();
      APP.ndc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      APP.ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function raycastSelectable(ev){
      setNDC(ev);
      APP.ray.setFromCamera(APP.ndc, APP.camera);
      return APP.ray.intersectObjects(APP.selectable, true);
    }

    function pickRoot(obj){
      while (obj.parent && !APP.selectable.includes(obj)) obj = obj.parent;
      return obj;
    }

    function onPointerDown(ev){
      // Skip if tapping on UI elements
      if (ev.target.closest && ev.target.closest('#editor-ui')) return;

      const hits = raycastSelectable(ev);
      if (hits.length){
        const root = pickRoot(hits[0].object);
        if (APP.selectable.includes(root)){
          selectObject(root);

          // Start dragging
          setNDC(ev);
          APP.ray.setFromCamera(APP.ndc, APP.camera);
          const hit = APP.ray.ray.intersectPlane(APP.drag.plane, APP.drag.intersection);
          if (hit){
            APP.drag.active = true;
            APP.drag.pointerId = ev.pointerId;
            APP.drag.offset.copy(root.position).sub(APP.drag.intersection);
            APP.controls.enabled = false;
            APP.renderer.domElement.setPointerCapture(ev.pointerId);
          }
        }
      } else {
        deselectObject();
      }
    }

    function onPointerMove(ev){
      if (!APP.drag.active || !APP.selected) return;
      if (ev.pointerId !== APP.drag.pointerId) return;

      setNDC(ev);
      APP.ray.setFromCamera(APP.ndc, APP.camera);
      const hit = APP.ray.ray.intersectPlane(APP.drag.plane, APP.drag.intersection);
      if (!hit) return;

      const newPos = APP.drag.intersection.clone().add(APP.drag.offset);

      // Clamp within studio bounds
      const bounds = 7;
      newPos.x = clamp(newPos.x, -bounds, bounds);
      newPos.z = clamp(newPos.z, -bounds, bounds);
      newPos.y = 0; // Keep on floor

      APP.selected.position.copy(newPos);

      // Update spotlight target if moving the light
      if (APP.selected.userData.kind === 'light'){
        const spot = APP.selected.userData.spotlight;
        const target = APP.selected.userData.spotTarget;
        if (spot && target){
          // Spotlight always points at the statue
          if (APP.statue){
            target.position.set(
              APP.statue.position.x - APP.selected.position.x,
              -3.2,
              APP.statue.position.z - APP.selected.position.z
            );
          }
        }
      }

      updateSelectionInfo();
    }

    function onPointerUp(ev){
      if (APP.drag.active && ev.pointerId === APP.drag.pointerId){
        APP.drag.active = false;
        APP.drag.pointerId = -1;
        APP.controls.enabled = true;
        try { APP.renderer.domElement.releasePointerCapture(ev.pointerId); } catch(e){}
      }
    }

    function selectObject(obj){
      APP.selected = obj;
      updateSelectionInfo();
    }

    function deselectObject(){
      APP.selected = null;
      updateSelectionInfo();
    }

    function updateSelectionInfo(){
      const nameEl = document.getElementById('sel-name');
      const posEl = document.getElementById('sel-pos');

      if (APP.selected){
        const name = APP.selected.userData.displayName || 'Object';
        const p = APP.selected.position;
        nameEl.textContent = name;
        posEl.textContent = `x:${p.x.toFixed(1)} z:${p.z.toFixed(1)}`;
      } else {
        nameEl.textContent = 'Nothing selected';
        posEl.textContent = '';
      }
    }

    /* =========================
       Helpers
    ========================= */
    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

    function handleResize(){
      const w = window.innerWidth, h = window.innerHeight;
      APP.renderer.setSize(w, h);
      APP.camera.aspect = w / h;
      APP.camera.updateProjectionMatrix();
    }

    /* =========================
       Selection highlight ring (screen-space)
    ========================= */
    const selectRing = document.createElement('div');
    selectRing.className = 'select-ring';
    selectRing.style.width = '60px';
    selectRing.style.height = '60px';
    selectRing.style.opacity = '0';
    document.body.appendChild(selectRing);

    function updateSelectRingPosition(){
      if (!APP.selected || !APP.camera){
        selectRing.style.opacity = '0';
        return;
      }

      const pos = APP.selected.position.clone();
      pos.y += 0.1; // Slightly above floor

      const screenPos = pos.project(APP.camera);
      const hw = window.innerWidth / 2;
      const hh = window.innerHeight / 2;

      const sx = screenPos.x * hw + hw;
      const sy = -screenPos.y * hh + hh;

      // Only show if in front of camera
      if (screenPos.z > 0 && screenPos.z < 1){
        selectRing.style.left = sx + 'px';
        selectRing.style.top = sy + 'px';
        selectRing.style.opacity = '1';

        // Scale ring based on distance
        const dist = APP.camera.position.distanceTo(APP.selected.position);
        const scale = clamp(80 / dist, 30, 120);
        selectRing.style.width = scale + 'px';
        selectRing.style.height = scale + 'px';
      } else {
        selectRing.style.opacity = '0';
      }
    }

    /* =========================
       Main loop
    ========================= */
    function animate(){
      requestAnimationFrame(animate);

      APP.controls.update();

      // Keep spotlight pointing at statue if it exists
      if (APP.studioLight && APP.statue && !APP.drag.active){
        const spot = APP.studioLight.userData.spotlight;
        const target = APP.studioLight.userData.spotTarget;
        if (spot && target){
          target.position.set(
            APP.statue.position.x - APP.studioLight.position.x,
            -3.2,
            APP.statue.position.z - APP.studioLight.position.z
          );
        }
      }

      // Update selection ring
      updateSelectRingPosition();

      // FPS counter
      const now = performance.now();
      APP.fps.frames++;
      if (now - APP.fps.last >= 500){
        const fps = Math.round((APP.fps.frames * 1000) / (now - APP.fps.last));
        const el = document.getElementById('fps');
        if (el) el.textContent = `FPS: ${fps}`;
        APP.fps.frames = 0;
        APP.fps.last = now;
      }

      APP.renderer.render(APP.scene, APP.camera);
    }
  </script>
</body>
</html>
