<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>The Set – Studio Editor</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      overflow:hidden;background:#111;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      user-select:none;-webkit-user-select:none;
      touch-action:none;
    }
    canvas{
      display:block;width:100vw !important;height:100vh !important;
      position:fixed;inset:0;
    }

    /* ========== MAIN MENU ========== */
    #mainMenu{
      position:fixed;inset:0;z-index:500;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:linear-gradient(170deg, #0a0a0f 0%, #151520 40%, #1a1a2e 100%);
      transition:opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #mainMenu.fade-out{
      opacity:0;
      pointer-events:none;
    }

    .menu-title{
      font-size:clamp(42px, 8vw, 80px);
      font-weight:900;
      letter-spacing:6px;
      text-transform:uppercase;
      margin-bottom:8px;
      background:linear-gradient(135deg, #fff 0%, #aab 50%, #fff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      text-shadow:none;
    }
    .menu-subtitle{
      font-size:clamp(12px, 2vw, 16px);
      letter-spacing:8px;
      text-transform:uppercase;
      color:rgba(255,255,255,0.35);
      margin-bottom:60px;
    }

    .menu-btn{
      display:block;width:220px;
      padding:16px 0;margin:8px 0;
      font-size:14px;font-weight:800;
      letter-spacing:3px;text-transform:uppercase;
      text-align:center;
      border-radius:60px;border:none;
      cursor:pointer;
      transition:transform .12s, box-shadow .2s, background .2s;
    }
    .menu-btn:active{transform:scale(0.96);}

    .menu-btn.play{
      background:linear-gradient(135deg, #fff 0%, #ddd 100%);
      color:#111;
      box-shadow:0 4px 30px rgba(255,255,255,0.15);
    }
    .menu-btn.play:hover{
      box-shadow:0 6px 40px rgba(255,255,255,0.25);
      transform:scale(1.03);
    }

    .menu-btn.exit{
      background:transparent;
      color:rgba(255,255,255,0.45);
      border:1px solid rgba(255,255,255,0.12);
    }
    .menu-btn.exit:hover{
      color:rgba(255,255,255,0.7);
      border-color:rgba(255,255,255,0.25);
    }

    /* ========== EDITOR UI OVERLAY ========== */
    #editorUI{
      position:fixed;inset:0;z-index:100;
      pointer-events:none;
      opacity:0;
      transition:opacity 0.6s ease-in 1.4s;
    }
    #editorUI.visible{
      opacity:1;
    }

    .editor-topbar{
      position:absolute;top:0;left:0;right:0;
      height:52px;
      background:rgba(18,18,24,0.92);
      border-bottom:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;
      pointer-events:auto;
    }
    .topbar-title{
      font-size:13px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;
      color:rgba(255,255,255,0.7);
    }
    .topbar-mode{
      font-size:11px;font-weight:600;
      letter-spacing:1.5px;text-transform:uppercase;
      padding:6px 14px;
      border-radius:20px;
      background:rgba(100,200,255,0.12);
      color:#68ccff;
      border:1px solid rgba(100,200,255,0.2);
    }

    /* Side panel */
    .editor-panel{
      position:absolute;top:62px;right:10px;
      width:200px;
      background:rgba(18,18,24,0.92);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      padding:16px;
      pointer-events:auto;
    }
    .panel-heading{
      font-size:10px;font-weight:800;
      letter-spacing:1.5px;text-transform:uppercase;
      color:rgba(255,255,255,0.4);
      margin-bottom:12px;
    }
    .object-item{
      display:flex;align-items:center;gap:10px;
      padding:10px;margin-bottom:6px;
      border-radius:10px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.06);
      cursor:pointer;
      transition:background .15s, border-color .15s;
    }
    .object-item:hover{
      background:rgba(255,255,255,0.06);
    }
    .object-item.selected{
      background:rgba(100,200,255,0.08);
      border-color:rgba(100,200,255,0.3);
    }
    .object-icon{
      width:32px;height:32px;
      border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;
    }
    .object-icon.statue{
      background:rgba(180,160,140,0.2);
      color:#c8b8a8;
    }
    .object-icon.light{
      background:rgba(255,220,80,0.15);
      color:#ffd84a;
    }
    .object-label{
      font-size:12px;font-weight:600;
      color:rgba(255,255,255,0.8);
    }
    .object-pos{
      font-size:9px;font-weight:500;
      color:rgba(255,255,255,0.3);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    }

    /* Bottom hint bar */
    .editor-hint{
      position:absolute;bottom:16px;left:50%;
      transform:translateX(-50%);
      padding:10px 24px;
      border-radius:30px;
      background:rgba(18,18,24,0.85);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      font-size:11px;font-weight:600;
      letter-spacing:1px;
      color:rgba(255,255,255,0.4);
      pointer-events:auto;
      white-space:nowrap;
    }

    /* Grid label */
    .grid-label{
      position:absolute;bottom:16px;left:16px;
      font-size:10px;font-weight:600;
      letter-spacing:1.2px;text-transform:uppercase;
      color:rgba(255,255,255,0.15);
      pointer-events:none;
    }

    /* Selection ring rendered in CSS on top of canvas */
    #selectionRing{
      position:fixed;z-index:90;
      pointer-events:none;
      border:2px solid rgba(100,200,255,0.6);
      border-radius:50%;
      box-shadow:0 0 12px rgba(100,200,255,0.2), inset 0 0 8px rgba(100,200,255,0.1);
      display:none;
      transition:width .1s, height .1s;
    }

    /* Light cone glow */
    #lightConeGlow{
      position:fixed;z-index:85;
      pointer-events:none;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,220,80,0.12) 0%, rgba(255,220,80,0) 70%);
      display:none;
    }
  </style>
</head>
<body>

<!-- ===== MAIN MENU ===== -->
<div id="mainMenu">
  <div class="menu-title">The Set</div>
  <div class="menu-subtitle">Studio Editor</div>
  <button class="menu-btn play" id="btnPlay">Play</button>
  <button class="menu-btn exit" id="btnExit">Exit</button>
</div>

<!-- ===== EDITOR UI ===== -->
<div id="editorUI">
  <div class="editor-topbar">
    <span class="topbar-title">The Set</span>
    <span class="topbar-mode">Editor Mode</span>
  </div>

  <div class="editor-panel">
    <div class="panel-heading">Objects</div>
    <div class="object-item selected" id="itemStatue" data-obj="statue">
      <div class="object-icon statue">&#9819;</div>
      <div>
        <div class="object-label">Statue</div>
        <div class="object-pos" id="posStatue">x: 0 &nbsp; z: 0</div>
      </div>
    </div>
    <div class="object-item" id="itemLight" data-obj="light">
      <div class="object-icon light">&#9788;</div>
      <div>
        <div class="object-label">Studio Light</div>
        <div class="object-pos" id="posLight">x: 0 &nbsp; z: 0</div>
      </div>
    </div>
  </div>

  <div class="editor-hint">Tap &amp; drag objects to reposition</div>
  <div class="grid-label">Top-Down View</div>
</div>

<div id="selectionRing"></div>
<div id="lightConeGlow"></div>

<script>
/* =========================================================
   THE SET – Studio Editor (Top-Down)
   Main menu → fade → top-down studio with draggable objects
   ========================================================= */

// ── Menu Logic ──────────────────────────────────────────
const mainMenu  = document.getElementById('mainMenu');
const editorUI  = document.getElementById('editorUI');
const btnPlay   = document.getElementById('btnPlay');
const btnExit   = document.getElementById('btnExit');

let editorStarted = false;

btnPlay.addEventListener('click', () => {
  if (editorStarted) return;
  editorStarted = true;
  mainMenu.classList.add('fade-out');
  // After the menu fades, remove it and show editor UI
  setTimeout(() => {
    mainMenu.style.display = 'none';
    editorUI.classList.add('visible');
    initEditor();
  }, 1900);
});

btnExit.addEventListener('click', () => {
  // Close the tab/window (only works if opened by script)
  if (window.close) window.close();
  // Fallback: show a message
  mainMenu.querySelector('.menu-subtitle').textContent = 'You can close this tab.';
});

// ── Three.js Editor ─────────────────────────────────────
let scene, camera, renderer;
let studioFloor, studioWalls;
let statueGroup, lightGroup;
let raycaster, pointer;
let dragging = null;      // which object is being dragged
let dragOffset = new THREE.Vector3();
let dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let selected = 'statue';  // currently selected in UI

const selectionRing = document.getElementById('selectionRing');
const lightConeGlow = document.getElementById('lightConeGlow');

function initEditor() {
  // ── Scene ──
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111118);

  // ── Camera (top-down orthographic) ──
  const aspect = window.innerWidth / window.innerHeight;
  const frustum = 8;
  camera = new THREE.OrthographicCamera(
    -frustum * aspect, frustum * aspect,
    frustum, -frustum,
    0.1, 100
  );
  camera.position.set(0, 20, 0);
  camera.lookAt(0, 0, 0);

  // ── Renderer ──
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  // ── Lighting ──
  const ambient = new THREE.AmbientLight(0x334455, 0.6);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
  dirLight.position.set(5, 15, 5);
  scene.add(dirLight);

  // ── Studio Floor ──
  const floorGeo = new THREE.PlaneGeometry(14, 14);
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x1c1c24,
    roughness: 0.85,
    metalness: 0.05
  });
  studioFloor = new THREE.Mesh(floorGeo, floorMat);
  studioFloor.rotation.x = -Math.PI / 2;
  studioFloor.receiveShadow = true;
  scene.add(studioFloor);

  // ── Grid lines (subtle) ──
  const gridSize = 14;
  const gridDiv  = 14;
  const gridHelper = new THREE.GridHelper(gridSize, gridDiv, 0x2a2a36, 0x1f1f2a);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);

  // ── Studio Walls (top-down visible as edges) ──
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x252530,
    roughness: 0.9,
    metalness: 0.0
  });

  // Back wall
  const backWall = new THREE.Mesh(
    new THREE.BoxGeometry(14, 3, 0.15),
    wallMat
  );
  backWall.position.set(0, 1.5, -7);
  scene.add(backWall);

  // Left wall
  const leftWall = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 3, 14),
    wallMat
  );
  leftWall.position.set(-7, 1.5, 0);
  scene.add(leftWall);

  // Right wall
  const rightWall = new THREE.Mesh(
    new THREE.BoxGeometry(0.15, 3, 14),
    wallMat
  );
  rightWall.position.set(7, 1.5, 0);
  scene.add(rightWall);

  // ── Statue (Subject) ──
  statueGroup = new THREE.Group();
  statueGroup.userData.type = 'statue';

  // Base/pedestal
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x8a8078, roughness: 0.6, metalness: 0.1 });
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.6, 0.3, 24), baseMat);
  base.position.y = 0.15;
  base.castShadow = true;
  statueGroup.add(base);

  // Body
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb0a898, roughness: 0.45, metalness: 0.05 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.35, 1.2, 16), bodyMat);
  body.position.y = 0.9;
  body.castShadow = true;
  statueGroup.add(body);

  // Torso
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.28, 0.7, 16), bodyMat);
  torso.position.y = 1.85;
  torso.castShadow = true;
  statueGroup.add(torso);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), bodyMat);
  head.position.y = 2.45;
  head.castShadow = true;
  statueGroup.add(head);

  statueGroup.position.set(0, 0, 0);
  scene.add(statueGroup);

  // ── Studio Light ──
  lightGroup = new THREE.Group();
  lightGroup.userData.type = 'light';

  // Stand pole
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.7, metalness: 0.4 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 2.2, 8), poleMat);
  pole.position.y = 1.1;
  lightGroup.add(pole);

  // Stand base (tripod feet - 3 small boxes)
  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2;
    const foot = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.04, 0.5),
      poleMat
    );
    foot.position.set(Math.sin(angle) * 0.2, 0.02, Math.cos(angle) * 0.2);
    foot.rotation.y = angle;
    lightGroup.add(foot);
  }

  // Light head (rectangular softbox shape)
  const softboxMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.3 });
  const softbox = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.12), softboxMat);
  softbox.position.y = 2.3;
  lightGroup.add(softbox);

  // Emissive face of the softbox
  const emissiveMat = new THREE.MeshStandardMaterial({
    color: 0xfff5e0,
    emissive: 0xffd84a,
    emissiveIntensity: 0.8,
    roughness: 0.3
  });
  const emissiveFace = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.4), emissiveMat);
  emissiveFace.position.set(0, 2.3, 0.07);
  lightGroup.add(emissiveFace);

  // Actual spotlight
  const spotLight = new THREE.SpotLight(0xffeedd, 1.5, 12, Math.PI / 5, 0.5, 1.5);
  spotLight.position.set(0, 2.3, 0);
  spotLight.target.position.set(0, 0, 0.5);
  spotLight.castShadow = true;
  spotLight.shadow.mapSize.set(512, 512);
  lightGroup.add(spotLight);
  lightGroup.add(spotLight.target);

  lightGroup.position.set(3, 0, -2);
  scene.add(lightGroup);

  // ── Interaction setup ──
  raycaster = new THREE.Raycaster();
  pointer   = new THREE.Vector2();

  // Draggable objects list
  const draggables = [statueGroup, lightGroup];

  // ── Pointer events ──
  const canvas = renderer.domElement;

  function getPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    pointer.x =  ((clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  }

  function getPointerEnd(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    pointer.x =  ((clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  }

  function hitTest() {
    raycaster.setFromCamera(pointer, camera);
    for (const grp of draggables) {
      const hits = raycaster.intersectObjects(grp.children, true);
      if (hits.length > 0) return grp;
    }
    return null;
  }

  function onDown(e) {
    e.preventDefault();
    getPointer(e);
    const hit = hitTest();
    if (hit) {
      dragging = hit;
      selected = hit.userData.type;
      updateSelection();

      // Calculate drag offset
      raycaster.setFromCamera(pointer, camera);
      const intersection = new THREE.Vector3();
      raycaster.ray.intersectPlane(dragPlane, intersection);
      dragOffset.copy(hit.position).sub(intersection);
    }
  }

  function onMove(e) {
    e.preventDefault();
    if (!dragging) return;

    if (e.touches) {
      getPointer(e);
    } else {
      getPointer(e);
    }

    raycaster.setFromCamera(pointer, camera);
    const intersection = new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane, intersection);

    const newPos = intersection.add(dragOffset);
    // Clamp within studio bounds
    const limit = 6.2;
    newPos.x = Math.max(-limit, Math.min(limit, newPos.x));
    newPos.z = Math.max(-limit, Math.min(limit, newPos.z));

    dragging.position.x = newPos.x;
    dragging.position.z = newPos.z;

    // Update the spotlight target to face the statue if dragging the light
    if (dragging.userData.type === 'light') {
      const spotTarget = dragging.children.find(c => c.isObject3D && c.position && c === spotLight.target);
      if (spotTarget) {
        // Point roughly toward center/statue
        const dir = new THREE.Vector3().subVectors(statueGroup.position, lightGroup.position).normalize();
        spotTarget.position.set(dir.x * 2, 0, dir.z * 2);
      }
    }

    updatePositionLabels();
  }

  function onUp(e) {
    if (e) {
      if (e.changedTouches || e.type === 'mouseup') {
        getPointerEnd(e);
      }
    }
    dragging = null;
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);

  // ── UI panel click to select ──
  document.getElementById('itemStatue').addEventListener('click', () => {
    selected = 'statue';
    updateSelection();
  });
  document.getElementById('itemLight').addEventListener('click', () => {
    selected = 'light';
    updateSelection();
  });

  // ── Resize ──
  window.addEventListener('resize', onResize);

  // ── Start render loop ──
  updateSelection();
  updatePositionLabels();
  animate();
}

function updateSelection() {
  const itemStatue = document.getElementById('itemStatue');
  const itemLight  = document.getElementById('itemLight');
  itemStatue.classList.toggle('selected', selected === 'statue');
  itemLight.classList.toggle('selected', selected === 'light');
}

function updatePositionLabels() {
  if (!statueGroup || !lightGroup) return;
  document.getElementById('posStatue').innerHTML =
    `x: ${statueGroup.position.x.toFixed(1)} &nbsp; z: ${statueGroup.position.z.toFixed(1)}`;
  document.getElementById('posLight').innerHTML =
    `x: ${lightGroup.position.x.toFixed(1)} &nbsp; z: ${lightGroup.position.z.toFixed(1)}`;
}

function projectToScreen(obj) {
  const pos = new THREE.Vector3();
  pos.copy(obj.position);
  pos.project(camera);
  return {
    x: ( pos.x * 0.5 + 0.5) * window.innerWidth,
    y: (-pos.y * 0.5 + 0.5) * window.innerHeight
  };
}

function updateOverlays() {
  if (!statueGroup || !lightGroup) return;

  // Selection ring on the selected object
  const target = selected === 'statue' ? statueGroup : lightGroup;
  const screen = projectToScreen(target);

  // Approximate radius in screen px based on camera frustum
  const frustumWidth = camera.right - camera.left;
  const objRadius = selected === 'statue' ? 0.7 : 0.5;
  const ringSize = (objRadius / frustumWidth) * window.innerWidth * 2;

  selectionRing.style.display = 'block';
  selectionRing.style.width  = ringSize + 'px';
  selectionRing.style.height = ringSize + 'px';
  selectionRing.style.left   = (screen.x - ringSize / 2) + 'px';
  selectionRing.style.top    = (screen.y - ringSize / 2) + 'px';

  // Light cone glow
  const lightScreen = projectToScreen(lightGroup);
  const glowSize = (3.5 / frustumWidth) * window.innerWidth * 2;
  lightConeGlow.style.display = 'block';
  lightConeGlow.style.width  = glowSize + 'px';
  lightConeGlow.style.height = glowSize + 'px';
  lightConeGlow.style.left   = (lightScreen.x - glowSize / 2) + 'px';
  lightConeGlow.style.top    = (lightScreen.y - glowSize / 2) + 'px';
}

function onResize() {
  if (!camera || !renderer) return;
  const aspect = window.innerWidth / window.innerHeight;
  const frustum = 8;
  camera.left   = -frustum * aspect;
  camera.right  =  frustum * aspect;
  camera.top    =  frustum;
  camera.bottom = -frustum;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);

  // Gently rotate the light emissive face brightness (pulsing)
  if (lightGroup) {
    const t = performance.now() * 0.001;
    const emissiveFace = lightGroup.children[5]; // emissive plane
    if (emissiveFace && emissiveFace.material) {
      emissiveFace.material.emissiveIntensity = 0.6 + Math.sin(t * 2) * 0.2;
    }
  }

  updateOverlays();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
