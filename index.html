<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>The Set – Studio Editor</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      overflow:hidden;background:#111;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      user-select:none;-webkit-user-select:none;
      touch-action:none;
    }
    canvas{
      display:block;width:100vw !important;height:100vh !important;
      position:fixed;inset:0;
    }

    /* ========== MAIN MENU ========== */
    #mainMenu{
      position:fixed;inset:0;z-index:500;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:linear-gradient(170deg, #0a0a0f 0%, #151520 40%, #1a1a2e 100%);
      transition:opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #mainMenu.fade-out{
      opacity:0;
      pointer-events:none;
    }

    .menu-title{
      font-size:clamp(42px, 8vw, 80px);
      font-weight:900;
      letter-spacing:6px;
      text-transform:uppercase;
      margin-bottom:8px;
      background:linear-gradient(135deg, #fff 0%, #aab 50%, #fff 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .menu-subtitle{
      font-size:clamp(12px, 2vw, 16px);
      letter-spacing:8px;
      text-transform:uppercase;
      color:rgba(255,255,255,0.35);
      margin-bottom:60px;
    }

    .menu-btn{
      display:block;width:220px;
      padding:16px 0;margin:8px 0;
      font-size:14px;font-weight:800;
      letter-spacing:3px;text-transform:uppercase;
      text-align:center;
      border-radius:60px;border:none;
      cursor:pointer;
      transition:transform .12s, box-shadow .2s, background .2s;
    }
    .menu-btn:active{transform:scale(0.96);}

    .menu-btn.play{
      background:linear-gradient(135deg, #fff 0%, #ddd 100%);
      color:#111;
      box-shadow:0 4px 30px rgba(255,255,255,0.15);
    }
    .menu-btn.play:hover{
      box-shadow:0 6px 40px rgba(255,255,255,0.25);
      transform:scale(1.03);
    }

    .menu-btn.exit{
      background:transparent;
      color:rgba(255,255,255,0.45);
      border:1px solid rgba(255,255,255,0.12);
    }
    .menu-btn.exit:hover{
      color:rgba(255,255,255,0.7);
      border-color:rgba(255,255,255,0.25);
    }

    /* ========== EDITOR UI OVERLAY ========== */
    #editorUI{
      position:fixed;inset:0;z-index:100;
      pointer-events:none;
      opacity:0;
      transition:opacity 0.6s ease-in;
    }
    #editorUI.visible{ opacity:1; }
    #editorUI.hidden{ display:none !important; }

    .editor-topbar{
      position:absolute;top:0;left:0;right:0;
      height:52px;
      background:rgba(18,18,24,0.92);
      border-bottom:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;
      pointer-events:auto;
    }
    .topbar-title{
      font-size:13px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;
      color:rgba(255,255,255,0.7);
    }
    .topbar-right{ display:flex;align-items:center;gap:10px; }
    .topbar-mode{
      font-size:11px;font-weight:600;
      letter-spacing:1.5px;text-transform:uppercase;
      padding:6px 14px;
      border-radius:20px;
      background:rgba(100,200,255,0.12);
      color:#68ccff;
      border:1px solid rgba(100,200,255,0.2);
    }

    /* Camera icon button */
    .btn-camera{
      width:38px;height:38px;
      border-radius:50%;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.15);
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background .15s, transform .1s;
      pointer-events:auto;
    }
    .btn-camera:hover{ background:rgba(255,255,255,0.12); }
    .btn-camera:active{ transform:scale(0.92); }
    .btn-camera svg{ width:18px;height:18px; }

    /* Side panel */
    .editor-panel{
      position:absolute;top:62px;right:10px;
      width:200px;
      background:rgba(18,18,24,0.92);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      padding:16px;
      pointer-events:auto;
    }
    .panel-heading{
      font-size:10px;font-weight:800;
      letter-spacing:1.5px;text-transform:uppercase;
      color:rgba(255,255,255,0.4);
      margin-bottom:12px;
    }
    .object-item{
      display:flex;align-items:center;gap:10px;
      padding:10px;margin-bottom:6px;
      border-radius:10px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.06);
      cursor:pointer;
      transition:background .15s, border-color .15s;
    }
    .object-item:hover{ background:rgba(255,255,255,0.06); }
    .object-item.selected{
      background:rgba(100,200,255,0.08);
      border-color:rgba(100,200,255,0.3);
    }
    .object-icon{
      width:32px;height:32px;
      border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;
    }
    .object-icon.statue{ background:rgba(180,160,140,0.2);color:#c8b8a8; }
    .object-icon.light{ background:rgba(255,220,80,0.15);color:#ffd84a; }
    .object-label{ font-size:12px;font-weight:600;color:rgba(255,255,255,0.8); }
    .object-pos{
      font-size:9px;font-weight:500;
      color:rgba(255,255,255,0.3);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    }

    /* Rotate hint */
    .editor-hint{
      position:absolute;bottom:16px;left:50%;
      transform:translateX(-50%);
      padding:10px 24px;
      border-radius:30px;
      background:rgba(18,18,24,0.85);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      font-size:11px;font-weight:600;
      letter-spacing:1px;
      color:rgba(255,255,255,0.4);
      pointer-events:auto;
      white-space:nowrap;
    }
    .grid-label{
      position:absolute;bottom:16px;left:16px;
      font-size:10px;font-weight:600;
      letter-spacing:1.2px;text-transform:uppercase;
      color:rgba(255,255,255,0.15);
      pointer-events:none;
    }

    /* Selection ring */
    #selectionRing{
      position:fixed;z-index:90;
      pointer-events:none;
      border:2px solid rgba(100,200,255,0.6);
      border-radius:50%;
      box-shadow:0 0 12px rgba(100,200,255,0.2), inset 0 0 8px rgba(100,200,255,0.1);
      display:none;
    }
    /* Light cone glow */
    #lightConeGlow{
      position:fixed;z-index:85;
      pointer-events:none;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,220,80,0.12) 0%, rgba(255,220,80,0) 70%);
      display:none;
    }

    /* ========== CAMERA / VIEWFINDER UI ========== */
    #cameraUI{
      position:fixed;inset:0;z-index:200;
      pointer-events:none;
      opacity:0;
      transition:opacity 0.4s ease-in;
      display:none;
    }
    #cameraUI.visible{ display:block;opacity:1; }

    /* Black camera frame border */
    .cam-frame{
      position:absolute;inset:0;
      border:28px solid #0a0a0a;
      pointer-events:none;
    }
    .cam-frame-inner{
      position:absolute;inset:28px;
      border:1px solid rgba(255,255,255,0.08);
    }

    /* Top camera bar */
    .cam-topbar{
      position:absolute;top:0;left:0;right:0;
      height:28px;
      background:#0a0a0a;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 36px;
      z-index:10;
    }
    .cam-readout{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      font-size:10px;font-weight:600;
      letter-spacing:0.8px;
      color:#e84040;
    }
    .cam-readout.green{ color:#40e870; }
    .cam-readout.amber{ color:#ffa830; }

    /* Bottom camera bar */
    .cam-bottombar{
      position:absolute;bottom:0;left:0;right:0;
      height:28px;
      background:#0a0a0a;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 36px;
      z-index:10;
    }

    /* Center crosshair / focus brackets */
    .cam-focus{
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:80px;height:80px;
      pointer-events:none;
    }
    .cam-focus-corner{
      position:absolute;
      width:16px;height:16px;
      border-color:rgba(255,255,255,0.55);
      border-style:solid;
    }
    .cam-focus-corner.tl{ top:0;left:0;border-width:2px 0 0 2px; }
    .cam-focus-corner.tr{ top:0;right:0;border-width:2px 2px 0 0; }
    .cam-focus-corner.bl{ bottom:0;left:0;border-width:0 0 2px 2px; }
    .cam-focus-corner.br{ bottom:0;right:0;border-width:0 2px 2px 0; }

    /* Center dot */
    .cam-center-dot{
      position:absolute;top:50%;left:50%;
      width:4px;height:4px;
      border-radius:50%;
      background:rgba(255,255,255,0.4);
      transform:translate(-50%,-50%);
    }

    /* Rule of thirds grid */
    .cam-grid{
      position:absolute;
      inset:28px;
      pointer-events:none;
    }
    .cam-grid-line{
      position:absolute;
      background:rgba(255,255,255,0.06);
    }
    .cam-grid-line.h{ left:28px;right:28px;height:1px; }
    .cam-grid-line.v{ top:28px;bottom:28px;width:1px; }
    .cam-grid-line.h1{ top:33.33%; }
    .cam-grid-line.h2{ top:66.66%; }
    .cam-grid-line.v1{ left:33.33%; }
    .cam-grid-line.v2{ left:66.66%; }

    /* HUD readouts (left side) */
    .cam-hud-left{
      position:absolute;
      top:40px;left:38px;
      display:flex;flex-direction:column;gap:6px;
      pointer-events:none;
    }
    .cam-hud-item{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      font-size:11px;font-weight:600;
      letter-spacing:0.5px;
      color:rgba(255,255,255,0.55);
      text-shadow:0 0 6px rgba(0,0,0,0.8);
    }
    .cam-hud-item .val{ color:#fff; }

    /* HUD readouts (right side) */
    .cam-hud-right{
      position:absolute;
      top:40px;right:38px;
      display:flex;flex-direction:column;gap:6px;
      align-items:flex-end;
      pointer-events:none;
    }

    /* Level indicator */
    .cam-level{
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:160px;height:1px;
      background:rgba(255,255,255,0.15);
      pointer-events:none;
    }
    .cam-level-tick{
      position:absolute;top:-3px;
      width:1px;height:7px;
      background:rgba(255,255,255,0.25);
    }
    .cam-level-center{
      position:absolute;top:-4px;left:50%;
      width:2px;height:9px;
      background:#40e870;
      transform:translateX(-50%);
    }

    /* Edit mode button (inside camera view) */
    .btn-edit-mode{
      position:absolute;top:38px;right:38px;
      padding:8px 16px;
      border-radius:20px;
      background:rgba(0,0,0,0.7);
      border:1px solid rgba(255,255,255,0.2);
      color:rgba(255,255,255,0.8);
      font-size:11px;font-weight:700;
      letter-spacing:1.5px;text-transform:uppercase;
      cursor:pointer;
      pointer-events:auto;
      transition:background .15s, transform .1s;
    }
    .btn-edit-mode:hover{ background:rgba(255,255,255,0.12); }
    .btn-edit-mode:active{ transform:scale(0.94); }

    /* Shutter button */
    .cam-shutter-wrap{
      position:absolute;bottom:46px;left:50%;
      transform:translateX(-50%);
      pointer-events:auto;
    }
    .cam-shutter{
      width:68px;height:68px;
      border-radius:50%;
      background:transparent;
      border:4px solid rgba(255,255,255,0.8);
      cursor:pointer;
      position:relative;
      transition:transform .08s;
    }
    .cam-shutter:active{ transform:scale(0.92); }
    .cam-shutter-inner{
      position:absolute;
      inset:4px;
      border-radius:50%;
      background:rgba(255,255,255,0.9);
      transition:background .08s;
    }
    .cam-shutter:active .cam-shutter-inner{
      background:rgba(200,200,200,0.95);
    }

    /* Flash overlay */
    #flashOverlay{
      position:fixed;inset:0;z-index:300;
      background:#fff;
      opacity:0;
      pointer-events:none;
      transition:opacity 0.06s linear;
    }
    #flashOverlay.flash{
      opacity:0.85;
      transition:opacity 0.02s linear;
    }

    /* Vignette */
    .cam-vignette{
      position:absolute;inset:28px;
      background:radial-gradient(circle at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.45) 100%);
      pointer-events:none;
    }

    /* Exposure meter bar (bottom-left) */
    .cam-meter{
      position:absolute;bottom:46px;left:38px;
      display:flex;flex-direction:column;align-items:center;gap:4px;
      pointer-events:none;
    }
    .cam-meter-bar{
      width:4px;height:80px;
      background:rgba(255,255,255,0.08);
      border-radius:2px;
      position:relative;
      overflow:hidden;
    }
    .cam-meter-fill{
      position:absolute;bottom:0;left:0;right:0;
      height:55%;
      background:linear-gradient(to top, #40e870, #ffa830);
      border-radius:2px;
    }
    .cam-meter-label{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:8px;font-weight:700;
      color:rgba(255,255,255,0.35);
      letter-spacing:1px;
    }

    /* Frame counter (bottom-right) */
    .cam-frame-counter{
      position:absolute;bottom:60px;right:38px;
      display:flex;flex-direction:column;align-items:flex-end;gap:2px;
      pointer-events:none;
    }
    .cam-frame-num{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:22px;font-weight:700;
      color:rgba(255,255,255,0.5);
      letter-spacing:1px;
    }
    .cam-frame-label{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:8px;font-weight:600;
      color:rgba(255,255,255,0.25);
      letter-spacing:1.5px;
    }
  </style>
</head>
<body>

<!-- ===== MAIN MENU ===== -->
<div id="mainMenu">
  <div class="menu-title">The Set</div>
  <div class="menu-subtitle">Studio Editor</div>
  <button class="menu-btn play" id="btnPlay">Play</button>
  <button class="menu-btn exit" id="btnExit">Exit</button>
</div>

<!-- ===== EDITOR UI ===== -->
<div id="editorUI">
  <div class="editor-topbar">
    <span class="topbar-title">The Set</span>
    <div class="topbar-right">
      <span class="topbar-mode">Editor Mode</span>
      <button class="btn-camera" id="btnCameraMode" title="Camera View">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="editor-panel">
    <div class="panel-heading">Objects</div>
    <div class="object-item selected" id="itemStatue" data-obj="statue">
      <div class="object-icon statue">&#9819;</div>
      <div>
        <div class="object-label">Statue</div>
        <div class="object-pos" id="posStatue">x: 0 &nbsp; z: 0</div>
      </div>
    </div>
    <div class="object-item" id="itemLight" data-obj="light">
      <div class="object-icon light">&#9788;</div>
      <div>
        <div class="object-label">Studio Light</div>
        <div class="object-pos" id="posLight">x: 0 &nbsp; z: 0</div>
      </div>
    </div>
  </div>

  <div class="editor-hint">Drag to move &middot; Tap to rotate 45&deg;</div>
  <div class="grid-label">Top-Down View</div>
</div>

<div id="selectionRing"></div>
<div id="lightConeGlow"></div>

<!-- ===== CAMERA / VIEWFINDER UI ===== -->
<div id="cameraUI">
  <!-- Black frame border -->
  <div class="cam-frame"></div>
  <div class="cam-frame-inner"></div>

  <!-- Top bar -->
  <div class="cam-topbar">
    <span class="cam-readout" id="camRecDot">&#9679; REC</span>
    <span class="cam-readout green" id="camBattery">&#9608;&#9608;&#9608; 87%</span>
  </div>

  <!-- Bottom bar -->
  <div class="cam-bottombar">
    <span class="cam-readout amber" id="camFocal">50mm</span>
    <span class="cam-readout" style="color:rgba(255,255,255,0.4);">THE SET</span>
    <span class="cam-readout amber" id="camMode">M</span>
  </div>

  <!-- Rule of thirds grid -->
  <div class="cam-grid">
    <div class="cam-grid-line h h1"></div>
    <div class="cam-grid-line h h2"></div>
    <div class="cam-grid-line v v1"></div>
    <div class="cam-grid-line v v2"></div>
  </div>

  <!-- Focus brackets -->
  <div class="cam-focus">
    <div class="cam-focus-corner tl"></div>
    <div class="cam-focus-corner tr"></div>
    <div class="cam-focus-corner bl"></div>
    <div class="cam-focus-corner br"></div>
    <div class="cam-center-dot"></div>
  </div>

  <!-- Level indicator -->
  <div class="cam-level">
    <div class="cam-level-tick" style="left:0"></div>
    <div class="cam-level-tick" style="left:25%"></div>
    <div class="cam-level-center"></div>
    <div class="cam-level-tick" style="left:75%"></div>
    <div class="cam-level-tick" style="left:100%"></div>
  </div>

  <!-- HUD left -->
  <div class="cam-hud-left">
    <div class="cam-hud-item">ISO <span class="val">400</span></div>
    <div class="cam-hud-item">f/<span class="val">2.8</span></div>
    <div class="cam-hud-item">1/<span class="val">125</span></div>
    <div class="cam-hud-item" style="color:rgba(255,180,40,0.6)">AWB</div>
  </div>

  <!-- Vignette -->
  <div class="cam-vignette"></div>

  <!-- Exposure meter -->
  <div class="cam-meter">
    <div class="cam-meter-bar"><div class="cam-meter-fill"></div></div>
    <div class="cam-meter-label">EV</div>
  </div>

  <!-- Frame counter -->
  <div class="cam-frame-counter">
    <div class="cam-frame-num" id="camFrameNum">001</div>
    <div class="cam-frame-label">FRAMES</div>
  </div>

  <!-- Edit mode button -->
  <button class="btn-edit-mode" id="btnEditMode">Edit Mode</button>

  <!-- Shutter button -->
  <div class="cam-shutter-wrap">
    <div class="cam-shutter" id="btnShutter">
      <div class="cam-shutter-inner"></div>
    </div>
  </div>
</div>

<!-- Flash overlay -->
<div id="flashOverlay"></div>

<script>
/* =========================================================
   THE SET – Studio Editor + Camera Viewfinder
   ========================================================= */

// ── DOM refs ────────────────────────────────────────────
const mainMenu     = document.getElementById('mainMenu');
const editorUI     = document.getElementById('editorUI');
const cameraUI     = document.getElementById('cameraUI');
const flashOverlay = document.getElementById('flashOverlay');
const btnPlay      = document.getElementById('btnPlay');
const btnExit      = document.getElementById('btnExit');
const btnCameraMode= document.getElementById('btnCameraMode');
const btnEditMode  = document.getElementById('btnEditMode');
const btnShutter   = document.getElementById('btnShutter');
const selectionRing= document.getElementById('selectionRing');
const lightConeGlow= document.getElementById('lightConeGlow');

let editorStarted = false;
let currentMode = 'editor'; // 'editor' | 'camera'
let frameCount = 0;

// ── Menu ────────────────────────────────────────────────
btnPlay.addEventListener('click', () => {
  if (editorStarted) return;
  editorStarted = true;
  mainMenu.classList.add('fade-out');
  setTimeout(() => {
    mainMenu.style.display = 'none';
    editorUI.classList.add('visible');
    initEditor();
  }, 1900);
});

btnExit.addEventListener('click', () => {
  if (window.close) window.close();
  mainMenu.querySelector('.menu-subtitle').textContent = 'You can close this tab.';
});

// ── Three.js globals ────────────────────────────────────
let scene, renderer;
let editCamera, perspCamera, activeCamera;
let studioFloor, backdrop;
let statueGroup, lightGroup, studioSpotLight;
let raycaster, pointer;
let dragging = null;
let dragStartPos = null;
let dragMoved = false;
let dragOffset = new THREE.Vector3();
let dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let selected = 'statue';
let draggables = [];

// ── Procedural wooden floor texture ─────────────────────
function createWoodTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');

  // Base warm wood color
  ctx.fillStyle = '#8B6914';
  ctx.fillRect(0, 0, 512, 512);

  // Wood planks
  const plankH = 64;
  for (let y = 0; y < 512; y += plankH) {
    // Slight color variation per plank
    const r = 110 + Math.random() * 40;
    const g = 75 + Math.random() * 30;
    const b = 15 + Math.random() * 20;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y, 512, plankH - 1);

    // Grain lines
    for (let i = 0; i < 8; i++) {
      const gy = y + Math.random() * plankH;
      ctx.strokeStyle = `rgba(${60+Math.random()*30},${40+Math.random()*20},${5+Math.random()*10},${0.15+Math.random()*0.2})`;
      ctx.lineWidth = 0.5 + Math.random();
      ctx.beginPath();
      ctx.moveTo(0, gy);
      // Wavy grain
      for (let x = 0; x < 512; x += 20) {
        ctx.lineTo(x, gy + Math.sin(x * 0.02 + i) * 2);
      }
      ctx.stroke();
    }

    // Plank gap line
    ctx.fillStyle = 'rgba(40,25,5,0.5)';
    ctx.fillRect(0, y + plankH - 1, 512, 1);
  }

  // Subtle noise
  for (let i = 0; i < 6000; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const a = Math.random() * 0.06;
    ctx.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;
    ctx.fillRect(x, y, 1, 1);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  return tex;
}

// ── Procedural backdrop texture ─────────────────────────
function createBackdropTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');

  // Soft gradient
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#c8c0b8');
  grad.addColorStop(0.5, '#b8b0a8');
  grad.addColorStop(1, '#a89888');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);

  // Paper texture noise
  for (let i = 0; i < 8000; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;
    const a = Math.random() * 0.04;
    ctx.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;
    ctx.fillRect(x, y, 1, 1);
  }

  return new THREE.CanvasTexture(canvas);
}

// ── Init Editor ─────────────────────────────────────────
function initEditor() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111118);
  scene.fog = new THREE.Fog(0x111118, 18, 30);

  // ── Edit camera (top-down orthographic) ──
  const aspect = window.innerWidth / window.innerHeight;
  const frustum = 8;
  editCamera = new THREE.OrthographicCamera(
    -frustum * aspect, frustum * aspect,
    frustum, -frustum, 0.1, 100
  );
  editCamera.position.set(0, 20, 0);
  editCamera.lookAt(0, 0, 0);

  // ── Perspective camera (photographer POV) ──
  perspCamera = new THREE.PerspectiveCamera(50, aspect, 0.1, 100);
  perspCamera.position.set(0, 2.5, 8);
  perspCamera.lookAt(0, 1.2, 0);

  activeCamera = editCamera;

  // ── Renderer ──
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  // ── Lighting ──
  const ambient = new THREE.AmbientLight(0x445566, 0.5);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xffeedd, 0.25);
  dirLight.position.set(5, 12, 5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  scene.add(dirLight);

  // ── Wooden Floor ──
  const woodTex = createWoodTexture();
  const floorGeo = new THREE.PlaneGeometry(14, 14);
  const floorMat = new THREE.MeshStandardMaterial({
    map: woodTex,
    roughness: 0.7,
    metalness: 0.05,
    color: 0xddccaa
  });
  studioFloor = new THREE.Mesh(floorGeo, floorMat);
  studioFloor.rotation.x = -Math.PI / 2;
  studioFloor.receiveShadow = true;
  scene.add(studioFloor);

  // ── Grid overlay (subtle, editor only) ──
  const gridHelper = new THREE.GridHelper(14, 14, 0x3a3530, 0x2d2820);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);

  // ── Studio Walls ──
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a2a32, roughness: 0.92 });

  const backWall = new THREE.Mesh(new THREE.BoxGeometry(14, 4, 0.15), wallMat);
  backWall.position.set(0, 2, -7);
  backWall.receiveShadow = true;
  scene.add(backWall);

  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, 4, 14), wallMat);
  leftWall.position.set(-7, 2, 0);
  scene.add(leftWall);

  const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.15, 4, 14), wallMat);
  rightWall.position.set(7, 2, 0);
  scene.add(rightWall);

  // ── Studio Backdrop (curved seamless) ──
  const bdTex = createBackdropTexture();
  const bdMat = new THREE.MeshStandardMaterial({
    map: bdTex,
    roughness: 0.85,
    metalness: 0.0,
    color: 0xc8c0b0,
    side: THREE.DoubleSide
  });

  // Floor part of backdrop
  const bdFloor = new THREE.Mesh(new THREE.PlaneGeometry(5, 4), bdMat);
  bdFloor.rotation.x = -Math.PI / 2;
  bdFloor.position.set(0, 0.02, -3.5);
  bdFloor.receiveShadow = true;
  scene.add(bdFloor);

  // Curved part (quarter-circle sweep connecting floor to wall)
  const curveSegs = 16;
  const curveRadius = 1.5;
  const curveGeo = new THREE.BufferGeometry();
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];
  const bdWidth = 5;
  const halfW = bdWidth / 2;

  for (let i = 0; i <= curveSegs; i++) {
    const t = i / curveSegs;
    const angle = t * Math.PI / 2;
    const z = -5.5 - Math.sin(angle) * curveRadius;
    const y = (1 - Math.cos(angle)) * curveRadius;
    const nz = -Math.sin(angle);
    const ny = Math.cos(angle);

    positions.push(-halfW, y, z, halfW, y, z);
    normals.push(0, ny, nz, 0, ny, nz);
    uvs.push(0, t, 1, t);

    if (i < curveSegs) {
      const row = i * 2;
      indices.push(row, row+1, row+2, row+1, row+3, row+2);
    }
  }

  curveGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  curveGeo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  curveGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  curveGeo.setIndex(indices);

  const curvedBackdrop = new THREE.Mesh(curveGeo, bdMat);
  curvedBackdrop.receiveShadow = true;
  scene.add(curvedBackdrop);

  // Flat upper wall part of backdrop
  const bdWall = new THREE.Mesh(new THREE.PlaneGeometry(5, 2.5), bdMat);
  const topOfCurve = curveRadius;
  bdWall.position.set(0, topOfCurve + 1.25, -5.5 - curveRadius);
  bdWall.receiveShadow = true;
  scene.add(bdWall);

  // ── Statue (Subject) ──
  statueGroup = new THREE.Group();
  statueGroup.userData.type = 'statue';

  const baseMat = new THREE.MeshStandardMaterial({ color: 0x8a8078, roughness: 0.55, metalness: 0.1 });
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb0a898, roughness: 0.4, metalness: 0.05 });

  // Pedestal
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.6, 0.3, 24), baseMat);
  base.position.y = 0.15; base.castShadow = true; base.receiveShadow = true;
  statueGroup.add(base);

  // Lower body
  const lowerBody = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.38, 1.0, 16), bodyMat);
  lowerBody.position.y = 0.8; lowerBody.castShadow = true;
  statueGroup.add(lowerBody);

  // Torso
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.28, 0.75, 16), bodyMat);
  torso.position.y = 1.68; torso.castShadow = true;
  statueGroup.add(torso);

  // Neck
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.2, 12), bodyMat);
  neck.position.y = 2.15; neck.castShadow = true;
  statueGroup.add(neck);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 16), bodyMat);
  head.position.y = 2.45; head.castShadow = true;
  statueGroup.add(head);

  // Arms (left + right)
  const armMat = new THREE.MeshStandardMaterial({ color: 0xa89888, roughness: 0.45, metalness: 0.05 });
  const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.8, 8), armMat);
  armL.position.set(-0.42, 1.5, 0); armL.rotation.z = 0.2; armL.castShadow = true;
  statueGroup.add(armL);
  const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.8, 8), armMat);
  armR.position.set(0.42, 1.5, 0); armR.rotation.z = -0.2; armR.castShadow = true;
  statueGroup.add(armR);

  statueGroup.position.set(0, 0, -3);
  scene.add(statueGroup);

  // ── Studio Light ──
  lightGroup = new THREE.Group();
  lightGroup.userData.type = 'light';

  const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.65, metalness: 0.45 });

  // Pole
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 2.4, 8), poleMat);
  pole.position.y = 1.2; lightGroup.add(pole);

  // Tripod feet
  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2;
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.03, 0.5), poleMat);
    foot.position.set(Math.sin(angle) * 0.18, 0.015, Math.cos(angle) * 0.18);
    foot.rotation.y = angle;
    lightGroup.add(foot);
  }

  // Softbox head
  const softboxMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.35 });
  const softbox = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.55, 0.14), softboxMat);
  softbox.position.y = 2.45; softbox.castShadow = true;
  lightGroup.add(softbox);

  // Emissive face
  const emissiveMat = new THREE.MeshStandardMaterial({
    color: 0xfff8e8, emissive: 0xffd84a, emissiveIntensity: 0.8, roughness: 0.3
  });
  const emissiveFace = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.45), emissiveMat);
  emissiveFace.position.set(0, 2.45, 0.08);
  lightGroup.add(emissiveFace);

  // Actual spotlight
  studioSpotLight = new THREE.SpotLight(0xffeedd, 2.0, 14, Math.PI / 5, 0.5, 1.5);
  studioSpotLight.position.set(0, 2.45, 0);
  studioSpotLight.target.position.set(0, 0, 1);
  studioSpotLight.castShadow = true;
  studioSpotLight.shadow.mapSize.set(1024, 1024);
  lightGroup.add(studioSpotLight);
  lightGroup.add(studioSpotLight.target);

  lightGroup.position.set(3, 0, -3);
  scene.add(lightGroup);

  // Point light toward statue
  updateSpotlightTarget();

  // ── Interaction ──
  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();
  draggables = [statueGroup, lightGroup];

  const canvas = renderer.domElement;

  function getPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    pointer.x =  ((cx - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
    return { cx, cy };
  }

  function hitTest() {
    raycaster.setFromCamera(pointer, activeCamera);
    for (const grp of draggables) {
      const hits = raycaster.intersectObjects(grp.children, true);
      if (hits.length > 0) return grp;
    }
    return null;
  }

  function onDown(e) {
    if (currentMode !== 'editor') return;
    e.preventDefault();
    const { cx, cy } = getPointer(e);
    const hit = hitTest();
    if (hit) {
      dragging = hit;
      dragMoved = false;
      dragStartPos = { x: cx, y: cy };
      selected = hit.userData.type;
      updateSelection();

      raycaster.setFromCamera(pointer, activeCamera);
      const intersection = new THREE.Vector3();
      raycaster.ray.intersectPlane(dragPlane, intersection);
      dragOffset.copy(hit.position).sub(intersection);
    }
  }

  function onMove(e) {
    if (currentMode !== 'editor' || !dragging) return;
    e.preventDefault();
    const { cx, cy } = getPointer(e);

    // Detect if we actually moved (vs just a tap)
    if (dragStartPos) {
      const dx = cx - dragStartPos.x;
      const dy = cy - dragStartPos.y;
      if (Math.sqrt(dx*dx + dy*dy) > 6) dragMoved = true;
    }

    if (!dragMoved) return;

    raycaster.setFromCamera(pointer, activeCamera);
    const intersection = new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane, intersection);

    const newPos = intersection.add(dragOffset);
    const limit = 6.2;
    newPos.x = Math.max(-limit, Math.min(limit, newPos.x));
    newPos.z = Math.max(-limit, Math.min(limit, newPos.z));

    dragging.position.x = newPos.x;
    dragging.position.z = newPos.z;

    updateSpotlightTarget();
    updatePositionLabels();
  }

  function onUp(e) {
    if (currentMode !== 'editor') return;
    if (dragging && !dragMoved) {
      // It was a TAP — rotate the object 45 degrees
      dragging.rotation.y += Math.PI / 4;
    }
    dragging = null;
    dragStartPos = null;
    dragMoved = false;
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);

  // ── UI panel selection ──
  document.getElementById('itemStatue').addEventListener('click', () => {
    selected = 'statue'; updateSelection();
  });
  document.getElementById('itemLight').addEventListener('click', () => {
    selected = 'light'; updateSelection();
  });

  // ── Mode switching ──
  btnCameraMode.addEventListener('click', switchToCameraMode);
  btnEditMode.addEventListener('click', switchToEditMode);
  btnShutter.addEventListener('click', takePhoto);

  window.addEventListener('resize', onResize);

  updateSelection();
  updatePositionLabels();
  animate();
}

// ── Spotlight always aims at statue ─────────────────────
function updateSpotlightTarget() {
  if (!studioSpotLight || !statueGroup || !lightGroup) return;
  const dir = new THREE.Vector3().subVectors(statueGroup.position, lightGroup.position).normalize();
  studioSpotLight.target.position.set(dir.x * 3, 0, dir.z * 3);
}

// ── Mode Switching ──────────────────────────────────────
function switchToCameraMode() {
  currentMode = 'camera';

  // Position perspective camera behind/in front of subject
  const statuePos = statueGroup.position;
  perspCamera.position.set(statuePos.x, 2.5, statuePos.z + 8);
  perspCamera.lookAt(statuePos.x, 1.2, statuePos.z);

  activeCamera = perspCamera;

  editorUI.classList.remove('visible');
  selectionRing.style.display = 'none';
  lightConeGlow.style.display = 'none';

  setTimeout(() => {
    cameraUI.classList.add('visible');
  }, 100);

  renderer.toneMappingExposure = 1.0;
}

function switchToEditMode() {
  currentMode = 'editor';
  activeCamera = editCamera;

  cameraUI.classList.remove('visible');

  setTimeout(() => {
    editorUI.classList.add('visible');
  }, 100);

  renderer.toneMappingExposure = 1.2;
}

// ── Take Photo (shutter) ────────────────────────────────
function takePhoto() {
  frameCount++;
  document.getElementById('camFrameNum').textContent =
    String(frameCount).padStart(3, '0');

  // Flash effect
  flashOverlay.classList.add('flash');
  setTimeout(() => {
    flashOverlay.classList.remove('flash');
    flashOverlay.style.opacity = '0';
  }, 80);

  // Save photo from canvas
  setTimeout(() => {
    try {
      const link = document.createElement('a');
      link.download = `the-set-${String(frameCount).padStart(3,'0')}.png`;
      link.href = renderer.domElement.toDataURL('image/png');
      link.click();
    } catch(e) { /* silent */ }
  }, 120);
}

// ── UI helpers ──────────────────────────────────────────
function updateSelection() {
  document.getElementById('itemStatue').classList.toggle('selected', selected === 'statue');
  document.getElementById('itemLight').classList.toggle('selected', selected === 'light');
}

function updatePositionLabels() {
  if (!statueGroup || !lightGroup) return;
  document.getElementById('posStatue').innerHTML =
    `x: ${statueGroup.position.x.toFixed(1)} &nbsp; z: ${statueGroup.position.z.toFixed(1)}`;
  document.getElementById('posLight').innerHTML =
    `x: ${lightGroup.position.x.toFixed(1)} &nbsp; z: ${lightGroup.position.z.toFixed(1)}`;
}

function projectToScreen(obj) {
  const pos = obj.position.clone();
  pos.project(activeCamera);
  return {
    x: ( pos.x * 0.5 + 0.5) * window.innerWidth,
    y: (-pos.y * 0.5 + 0.5) * window.innerHeight
  };
}

function updateOverlays() {
  if (currentMode !== 'editor' || !statueGroup || !lightGroup) {
    selectionRing.style.display = 'none';
    lightConeGlow.style.display = 'none';
    return;
  }

  const target = selected === 'statue' ? statueGroup : lightGroup;
  const screen = projectToScreen(target);
  const frustumWidth = editCamera.right - editCamera.left;
  const objRadius = selected === 'statue' ? 0.75 : 0.55;
  const ringSize = (objRadius / frustumWidth) * window.innerWidth * 2;

  selectionRing.style.display = 'block';
  selectionRing.style.width  = ringSize + 'px';
  selectionRing.style.height = ringSize + 'px';
  selectionRing.style.left   = (screen.x - ringSize / 2) + 'px';
  selectionRing.style.top    = (screen.y - ringSize / 2) + 'px';

  const lightScreen = projectToScreen(lightGroup);
  const glowSize = (3.5 / frustumWidth) * window.innerWidth * 2;
  lightConeGlow.style.display = 'block';
  lightConeGlow.style.width  = glowSize + 'px';
  lightConeGlow.style.height = glowSize + 'px';
  lightConeGlow.style.left   = (lightScreen.x - glowSize / 2) + 'px';
  lightConeGlow.style.top    = (lightScreen.y - glowSize / 2) + 'px';
}

// ── Resize ──────────────────────────────────────────────
function onResize() {
  if (!renderer) return;
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;

  // Edit camera
  const frustum = 8;
  editCamera.left   = -frustum * aspect;
  editCamera.right  =  frustum * aspect;
  editCamera.top    =  frustum;
  editCamera.bottom = -frustum;
  editCamera.updateProjectionMatrix();

  // Perspective camera
  perspCamera.aspect = aspect;
  perspCamera.updateProjectionMatrix();

  renderer.setSize(w, h);
}

// ── Animate ─────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  const t = performance.now() * 0.001;

  // Pulse light emissive
  if (lightGroup) {
    const emissive = lightGroup.children[5]; // emissive plane
    if (emissive && emissive.material) {
      emissive.material.emissiveIntensity = 0.65 + Math.sin(t * 2) * 0.2;
    }
  }

  // Camera mode: subtle idle sway
  if (currentMode === 'camera') {
    perspCamera.position.x += Math.sin(t * 0.3) * 0.0004;
    perspCamera.position.y += Math.cos(t * 0.4) * 0.0002;
  }

  // Blink REC dot
  const recDot = document.getElementById('camRecDot');
  if (recDot && currentMode === 'camera') {
    recDot.style.opacity = Math.sin(t * 3) > 0 ? '1' : '0.2';
  }

  updateOverlays();
  renderer.render(scene, activeCamera);
}
</script>
